name: watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-probe now, ignoring the 8-hour freshness window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  # Cancel keeps at most one run alive: a run that parks on judge
  # cooldowns could otherwise hold the whole 8-minute cap, and queueing
  # every 10-minute tick behind it backs the schedule up without bound.
  # One live run still serializes the state read-modify-write (the
  # in-flight run is dead, never concurrent) and the newest run is the one
  # worth keeping. State writes stay atomic + rebase-safe either way. The
  # PC-linked payload (state/linkedin-posts.json) is written by the local
  # loop's own rebase+retry push — never by this workflow.
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    # The probe walks EVERY LLM_ACCOUNTS account (doubling ramp 2→32, ~62
    # calls worst case each): an auth-dead key or a failed leg fails this
    # job, so a rotten key in the pool reddens the dispatch run instead of
    # passing unseen. 429-refused legs are reported as busy, not dead —
    # throttling is data. The measured per-account ceilings commit to
    # state/judge-ceilings.json (live-only, before the dead gate) and the
    # Commit ceilings step pushes them. The watch job NEEDS this job green
    # on dispatch runs — a fresh maximal reading flows into the same run's
    # watch; a red gate blocks that dispatch's watch (fail-fast). Scheduled
    # ticks never gate on it (this job is dispatch-only).
    # Freshness gate (2026-11-07): the probe runs at most once per 8 hours
    # from the last successful reading (probedAt in the committed ceilings
    # file). Inside a fresh window the gate skips the probe steps and the
    # job stays GREEN, so the watch job's needs.probe.result == 'success'
    # holds and the dispatch proceeds on committed ceilings - exactly the
    # schedule-tick path. A red probe commits nothing (Commit ceilings is
    # skipped on failure), so the next dispatch re-probes. inputs.force
    # re-probes immediately (rotated keys).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # The Commit ceilings step rebases onto the checkout branch's remote
        # head (the same
        # commit-state-rebase.sh body as the watch job): a shallow clone
        # cannot find the merge base and add/add-conflicts the whole tree.
        with:
          fetch-depth: 0

      - name: Freshness gate (8h)
        id: freshness
        # The 8-hour window (28800 s) is a hard-coded workflow literal, not
        # an env knob (the tuning-values doctrine). The clock is the
        # probedAt entry the probe script stamps on SUCCESS - a failed
        # probe commits nothing, so the next dispatch re-probes. The gate
        # only ever widens the skip: scheduled ticks never run this job.
        run: |
          LAST=$(jq -r '.probedAt // 0' state/judge-ceilings.json 2>/dev/null || echo 0)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "probe: force re-probe requested - ignoring the freshness window"
            LAST=0
          fi
          NOW=$(date +%s)
          if [ "$LAST" != "0" ] && [ $((NOW - LAST)) -lt 28800 ]; then
            echo "probe: ceilings are $(( (NOW - LAST) / 3600 ))h old (< 8h) - skipping the probe; watch proceeds on committed ceilings"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "probe: ceilings stale or unmeasured - running the probe"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.fresh != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.freshness.outputs.fresh != 'true'

      - name: Probe judge latency
        if: steps.freshness.outputs.fresh != 'true'
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
        run: npx tsx scripts/probe-judge.ts

      - name: Commit ceilings
        # The F021 head shape from the watch job's Commit state step,
        # minus the jq delta (the ceilings write is whole-file): bot
        # identity, the ceilings-file-only add, the no-op guard, then the
        # tested script — rebase, committed-state conflict skips, lease
        # push, single retry. The [-f] guard covers a probe that died
        # before its write (the probe step already failed the job; this
        # step cannot normally run on a red gate).
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/judge-ceilings.json ]; then
            git add state/judge-ceilings.json
          fi
          if git diff --cached --quiet; then
            echo "ceilings unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "judge: probe-measured ceilings"
          bash scripts/commit-state-rebase.sh

  watch:
    needs: [probe]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.probe.result == 'success') }}
    runs-on: ubuntu-latest
    # Serialization (2026-11-07): on dispatch runs this job WAITS for a
    # green probe and starts on the ceilings it just committed — the
    # fresh maximal reading reaches the same run. On schedule ticks the
    # probe is skipped (dispatch-only), and this if keeps the tick alive:
    # the run reads the committed state/judge-ceilings.json as before. A
    # red probe blocks only the dispatch's watch — the digest for that
    # dispatch is suppressed (accepted cost); scheduled ticks never gate
    # on the probe.
    # Judge width is Σ per-account ceilings (probe-measured, committed to
    # state/judge-ceilings.json — src/judge-ceilings.ts): there is no
    # single concurrency knob anymore. The dispatch spread keeps each
    # account at its own cap, the 429 rotation stays the correctness net,
    # and an absent ceilings file floors every account at 1 — correct but
    # slow until the next probe dispatch commits readings. The 8-minute
    # cap keeps a hung run under the 10-minute cron interval — it dies
    # before the next tick queues (cancel-in-progress now drops a
    # superseded run instead of queueing it).
    # Timeout envelope arithmetic (F023): 480s job cap - 60-100s setup
    # prologue (checkout + npm ci + Playwright install; the ms-playwright
    # cache removes 30-60s of it) - 60s abort tail leaves ~320-360s for the
    # fetch stage, judge waves, and parks. The LinkedIn fetch term left this
    # budget entirely (2026-11-04): the leg runs on the developer PC and
    # this job only READS its pushed payload — the fetch measurement note
    # moved to the PC-loop docs in README.md.
    # WAIT_BUDGET_MS (180s, src/judge.ts) caps the parked wait before the
    # exhaustion alarm, so the alarm lands ~1-2 min inside the cap and the
    # run still dies before the next 10-minute tick queues.
    #
    # The failure-path Commit health step adds one stat + one git add
    # inside the envelope: the exhaustion alarm lands ~1-2 min inside the
    # cap (WAIT_BUDGET_MS), leaving minutes for the commit-back.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        # The Commit state step rebases onto the checkout branch's remote
        # head; a shallow clone cannot
        # find the merge base and add/add-conflicts the whole tree.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browser
        # F020: the browser download repeats on every 10-minute tick. The
        # lockfile pins the browser build, so the key misses only on a
        # playwright bump. Saves the measured 30-60s install cost per run
        # (2026-10-27). runner.os separates OS-specific builds. The install
        # step stays unconditional: a cache miss self-heals, a hit makes it
        # a fast no-op.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # The watcher is headless-only; the full browser build adds install
        # minutes to every run for nothing the pipeline drives. The runner
        # image carries the chromium shared libraries, so --with-deps (an
        # apt-get pass measured at ~2-4 minutes per run on 2026-10-27 —
        # most of the 8-minute budget) is not needed for the headless shell.
        run: npx playwright install --only-shell chromium

      - name: Run watcher
        env:
          HEARTBEAT_ENABLED: ${{ vars.HEARTBEAT_ENABLED }}   # zero-match status email kill switch; unset = enabled
          THREADS_SESSION_STATE: ${{ secrets.THREADS_SESSION_STATE }}
          # The LinkedIn leg needs no secret here: the PC loop pushes
          # state/linkedin-posts.json and this job reads it from the
          # checkout — an absent/stale payload degrades to a threads-only
          # run (src/linkedin-payload.ts, D13).
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npx tsx src/index.ts

      - name: Commit health
        # The provider-health file's failure-path commit (the FR7 episode
        # bit must survive the run that SETS it): the exhaustion exit skips
        # every later step, so this one rides `always() && failure()` —
        # the same head shape as the probe job's Commit ceilings (bot
        # identity, the -f-guarded add of ONLY the health file, the no-op
        # guard, a fixed-message commit, the tested script). The [-f] guard
        # covers a run that died before the flush (the health file is
        # absent from every checkout until the first live run commits it —
        # an unconditional add of an absent path is fatal under the step's
        # implicit bash -e). The success path commits the same file through
        # the Commit state step below.
        if: always() && failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/judge-health.json ]; then
            git add state/judge-health.json
          fi
          if git diff --cached --quiet; then
            echo "health unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "judge: provider health marks"
          bash scripts/commit-state-rebase.sh

      - name: Commit state
        # F021: the queue serializes watcher runs, but a human push can land
        # between this run's checkout and its commit-back. The rebase, the
        # state-only conflict skip, the lease push, and the single retry all
        # live in the committed script under scripts/ — this step keeps only
        # the YAML-owned head: bot identity, the state-file-only add, the
        # no-op guard, and the jq delta commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen-posts.json
          # The health file joins the success-path commit set — guarded: a
          # Gate-1 tick (nothing unseen) never flushes, so the file can be
          # absent until the first live run creates it, and an unconditional
          # add of an absent pathspec is fatal under the step's implicit
          # bash -e.
          if [ -f state/judge-health.json ]; then
            git add state/judge-health.json
          fi
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          PREV=$(git show HEAD:state/seen-posts.json | jq '.seenPostIds | length' 2>/dev/null || echo 0)
          CURR=$(jq '.seenPostIds | length' state/seen-posts.json)
          git commit -m "state: $((CURR - PREV)) new seen post ids"
          bash scripts/commit-state-rebase.sh
