name: watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    # The probe walks EVERY LLM_ACCOUNTS account (stop-once-4 ramp, ~6
    # calls each): an auth-dead key or a failed leg fails this job, so a
    # rotten key in the pool reddens the dispatch run instead of passing
    # unseen. 429-refused legs are reported as busy, not dead — throttling
    # is data; the watch job is the real gate for it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe judge latency
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
        run: npx tsx scripts/probe-judge.ts

  watch:
    runs-on: ubuntu-latest
    # Width-4 judge (the probe job's reading): 30 bulk calls clear in ~8
    # waves, width-4 surface pools cut the serial fetch to ~1 min (71s
    # measured), and the 40-call fallback budget adds about a minute. The
    # 8-minute cap keeps a hung run under the 10-minute cron interval — it
    # dies before the next tick queues. Measured 2026-10-27: 8-wide bursts
    # drew HTTP 429s from the endpoint, 4-wide ran clean.
    # Timeout envelope arithmetic (F023): 480s job cap - 60-100s setup
    # prologue (checkout + npm ci + Playwright install; the ms-playwright
    # cache removes 30-60s of it) - 71s measured fetch worst case
    # (2026-10-27) - 60s abort tail leaves ~249-289s for judge waves and
    # parks. WAIT_BUDGET_MS (180s, src/judge.ts) caps the parked wait
    # before the exhaustion alarm, so the alarm lands ~1-2 min inside the
    # cap and the run still dies before the next 10-minute tick queues.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        # The Commit state step rebases onto main; a shallow clone cannot
        # find the merge base and add/add-conflicts the whole tree.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browser
        # F020: the browser download repeats on every 10-minute tick. The
        # lockfile pins the browser build, so the key misses only on a
        # playwright bump. Saves the measured 30-60s install cost per run
        # (2026-10-27). runner.os separates OS-specific builds. The install
        # step stays unconditional: a cache miss self-heals, a hit makes it
        # a fast no-op.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # The watcher is headless-only; the full browser build adds install
        # minutes to every run for nothing the pipeline drives. The runner
        # image carries the chromium shared libraries, so --with-deps (an
        # apt-get pass measured at ~2-4 minutes per run on 2026-10-27 —
        # most of the 8-minute budget) is not needed for the headless shell.
        run: npx playwright install --only-shell chromium

      - name: Run watcher
        env:
          JUDGE_CONCURRENCY: "4"   # probe run 40455686221 reading, z.ai burst-verified — paste a fresh measuring run's reading
          HEARTBEAT_ENABLED: ${{ vars.HEARTBEAT_ENABLED }}   # zero-match status email kill switch; unset = enabled
          THREADS_SESSION_STATE: ${{ secrets.THREADS_SESSION_STATE }}
          LINKEDIN_SESSION_STATE: ${{ secrets.LINKEDIN_SESSION_STATE }}   # absent secret => resolver null => Phase 7 fallback login (src/linkedin-login.ts)
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}          # Phase 7 fallback login; absent = fallback disabled
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_REFRESH_PATH: ${{ runner.temp }}/linkedin-refresh.b64   # Phase 7 self-refresh hand-off; written only on login success
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npx tsx src/index.ts

      - name: Refresh LinkedIn session secret
        # Phase 7: the watcher writes LINKEDIN_REFRESH_PATH only when its
        # fallback credential login succeeded, so the file's existence is the
        # gate (hashFiles cannot see runner.temp — it is workspace-scoped).
        # GH_TOKEN is the fine-grained PAT (this repo only, Actions secrets
        # read/write, short expiry) and exists only inside this step.
        env:
          GH_TOKEN: ${{ secrets.LINKEDIN_SECRET_WRITER }}
          LINKEDIN_REFRESH_PATH: ${{ runner.temp }}/linkedin-refresh.b64
        run: |
          if test -f "$LINKEDIN_REFRESH_PATH"; then
            # Non-fatal by contract: a wrong or expired PAT must not fail the
            # run — the watcher already judged, emailed, and still needs Commit
            # state. On failure, write the login cooldown marker right here:
            # that is where the failure is visible, and it stops the run from
            # re-logging-in every 10 minutes against a secret-write that keeps
            # failing (recorded as a challenge-shaped marker = 6h cool).
            if gh secret set LINKEDIN_SESSION_STATE --body-file "$LINKEDIN_REFRESH_PATH" --repo "$GITHUB_REPOSITORY"; then
              rm -f "$LINKEDIN_REFRESH_PATH"
              echo "LINKEDIN_SESSION_STATE refreshed from a successful credential login"
            else
              printf '{"lastAttempt": "%s", "lastOutcome": "challenge", "consecutiveTransients": 0}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > state/linkedin-login.json
              echo "secret refresh FAILED — cooldown marker written; check LINKEDIN_SECRET_WRITER"
            fi
          else
            echo "no fresh LinkedIn session this run — secret left as is"
          fi

      - name: Commit state
        # F021: the queue serializes watcher runs, but a human push can land
        # between this run's checkout and its commit-back. The rebase, the
        # state-only conflict skip, the lease push, and the single retry all
        # live in the committed script under scripts/ — this step keeps only
        # the YAML-owned head: bot identity, the state-file-only add, the
        # no-op guard, and the jq delta commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Phase 7: the login marker rides the same commit-back when present
          # (a failed login's 6h cooldown must survive to the next run).
          if test -f state/linkedin-login.json; then
            git add state/seen-posts.json state/linkedin-login.json
          else
            git add state/seen-posts.json
          fi
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          PREV=$(git show HEAD:state/seen-posts.json | jq '.seenPostIds | length' 2>/dev/null || echo 0)
          CURR=$(jq '.seenPostIds | length' state/seen-posts.json)
          git commit -m "state: $((CURR - PREV)) new seen post ids"
          bash scripts/commit-state-rebase.sh
