name: watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe judge latency
        env:
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
        run: npx tsx scripts/probe-judge.ts

  watch:
    runs-on: ubuntu-latest
    # Width-8 judge: 29 bulk calls clear in ~4 waves, width-4 surface pools
    # cut the ~3.5-min serial fetch to ~1 min, and the 40-call fallback
    # budget adds about a minute. The 8-minute cap keeps a hung run under
    # the 10-minute cron interval — it dies before the next tick queues.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        # The watcher is headless-only; the full browser build adds install
        # minutes to every run for nothing the pipeline drives.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run watcher
        env:
          JUDGE_CONCURRENCY: "8"   # probe run 40268599609 successor — paste the measuring run's reading
          THREADS_SESSION_STATE: ${{ secrets.THREADS_SESSION_STATE }}
          LLM_ACCOUNTS: ${{ secrets.LLM_ACCOUNTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npx tsx src/index.ts

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen-posts.json
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          PREV=$(git show HEAD:state/seen-posts.json | jq '.seenPostIds | length' 2>/dev/null || echo 0)
          CURR=$(jq '.seenPostIds | length' state/seen-posts.json)
          git commit -m "state: $((CURR - PREV)) new seen post ids"
          git push
